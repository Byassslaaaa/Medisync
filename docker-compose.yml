version: "3.9"

networks:
  medisync-net:
    driver: bridge

volumes:
  pgdata:

services:
  # ─────────────────────────────────────────
  # PostgreSQL — satu server, dua database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: medisync-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - medisync-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # RabbitMQ — message broker
  # ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: medisync-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    networks:
      - medisync-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # Service B — Rekam Medis (harus start duluan karena Service A bergantung padanya via gRPC)
  # ─────────────────────────────────────────
  service-b:
    build:
      context: ./service-b
      dockerfile: Dockerfile
    container_name: medisync-service-b
    environment:
      PORT: "4002"
      GRPC_PORT: "50052"
      DB_URL: "postgres://admin:secret123@postgres:5432/db_rekam_medis?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    ports:
      - "4002:4002"
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - medisync-net
    restart: on-failure

  # ─────────────────────────────────────────
  # Service A — Pendaftaran
  # ─────────────────────────────────────────
  service-a:
    build:
      context: ./service-a
      dockerfile: Dockerfile
    container_name: medisync-service-a
    environment:
      PORT: "4001"
      DB_URL: "postgres://admin:secret123@postgres:5432/db_pendaftaran?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      GRPC_SERVICE_B: "service-b:50052"
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-b:
        condition: service_started
    networks:
      - medisync-net
    restart: on-failure

  # ─────────────────────────────────────────
  # Frontend — React
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medisync-frontend
    ports:
      - "3000:80"
    depends_on:
      - service-a
    networks:
      - medisync-net
