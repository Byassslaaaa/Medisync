version: "3.9"

networks:
  medisync-net:
    driver: bridge

volumes:
  pgdata-a:   # Volume eksklusif untuk postgres-a (db_pendaftaran)
  pgdata-b:   # Volume eksklusif untuk postgres-b (db_rekam_medis)

services:
  # ─────────────────────────────────────────────────────────────
  # postgres-a — Database eksklusif Service A (Pendaftaran)
  # Hanya Service A yang boleh connect ke container ini.
  # ─────────────────────────────────────────────────────────────
  postgres-a:
    image: postgres:15-alpine
    container_name: medisync-postgres-a
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: db_pendaftaran
    volumes:
      - pgdata-a:/var/lib/postgresql/data
      - ./init-db-a.sql:/docker-entrypoint-initdb.d/init-db-a.sql
    ports:
      - "5433:5432"   # host:5433 → container:5432 (hindari konflik jika ada postgres lokal)
    networks:
      - medisync-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db_pendaftaran"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # postgres-b — Database eksklusif Service B (Rekam Medis)
  # Hanya Service B yang boleh connect ke container ini.
  # ─────────────────────────────────────────────────────────────
  postgres-b:
    image: postgres:15-alpine
    container_name: medisync-postgres-b
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: db_rekam_medis
    volumes:
      - pgdata-b:/var/lib/postgresql/data
      - ./init-db-b.sql:/docker-entrypoint-initdb.d/init-db-b.sql
    ports:
      - "5434:5432"   # host:5434 → container:5432
    networks:
      - medisync-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db_rekam_medis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # RabbitMQ — message broker
  # ─────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: medisync-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    networks:
      - medisync-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Service B — Rekam Medis
  # Hanya connect ke postgres-b. Tidak tahu postgres-a exist.
  # ─────────────────────────────────────────────────────────────
  service-b:
    build:
      context: ./service-b
      dockerfile: Dockerfile
    container_name: medisync-service-b
    environment:
      PORT: "4002"
      GRPC_PORT: "50052"
      DB_URL: "postgres://admin:secret123@postgres-b:5432/db_rekam_medis?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    ports:
      - "4002:4002"
      - "50052:50052"
    depends_on:
      postgres-b:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - medisync-net
    restart: on-failure

  # ─────────────────────────────────────────────────────────────
  # Service A — Pendaftaran
  # Hanya connect ke postgres-a. Tidak tahu postgres-b exist.
  # ─────────────────────────────────────────────────────────────
  service-a:
    build:
      context: ./service-a
      dockerfile: Dockerfile
    container_name: medisync-service-a
    environment:
      PORT: "4001"
      DB_URL: "postgres://admin:secret123@postgres-a:5432/db_pendaftaran?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      GRPC_SERVICE_B: "service-b:50052"
    ports:
      - "4001:4001"
    depends_on:
      postgres-a:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-b:
        condition: service_started
    networks:
      - medisync-net
    restart: on-failure

  # ─────────────────────────────────────────────────────────────
  # Frontend — React
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medisync-frontend
    ports:
      - "3000:80"
    depends_on:
      - service-a
    networks:
      - medisync-net
